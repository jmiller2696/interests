<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"defer></script>
    <script src="./lib/jquery-3.7.1.js"></script>
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #1c1c1c;
        margin: 0;
        padding: 20px;
        color: #eee;
        }

        .wrapper {
        width: 90%;
        max-width: 800px;
        margin: 0 auto;
        }

        .displayLine {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        padding: 10px;
        margin-bottom: 5px;
        border-radius: 5px;
        }

        .info {
        display: flex;
        align-items: center;
        gap: 10px;
        }

        .info img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 5px;
        }

        .buttons button {
        background-color: #e91e63;
        border: none;
        border-radius: 3px;
        color: #fff;
        padding: 5px 10px;
        margin-left: 5px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        }

        .buttons button:hover {
        background-color: #c2185b;
        }

        .showInfo {
        background-color: #444;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        display: none;
        }
    </style>
</head>
<body>
    <div class="wrapper"></div>
</body>
</html>
